<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>To check if the number is between 1 to 100</h1>
    <form>
        <input type="text" id="number" placeholder="Enter a number" max="100" min="1">
        <button type="button" onclick="mnop()">Submit</button>
    </form>
    <script>
        function mnop() {
            const number = document.getElementById('number').value;
            if (number >= 1 && number <= 100) {
                alert("The number is between 1 and 100.");
            } else {
                alert("The number is not between 1 and 100.");
            }
        }
    </script>
</body>
</html>
